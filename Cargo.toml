[package]
name = "semmem"
version = "0.1.0"
edition = "2024"
description = "Current-state human-readable memory, audited writes, and retrieval for AI."
repository = "https://github.com/mayazrakib/semmem"

[[bin]]
name = "semmem"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
colored_json = "5"
comfy-table = "7"
crossterm = "0.29"
fs2 = "0.4"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.7", features = ["server", "macros", "transport-streamable-http-server"] }
rusqlite = { version = "0.41", features = ["bundled", "functions"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
shell-words = "1"
tantivy = { version = "0.27", default-features = false, features = ["mmap", "lz4-compression"] }
tempfile = "3"
termimad = "0.34"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
assert_cmd = "2"
base64 = "0.22"
rand = "0.10"
rsa = "0.9"
rmcp = { version = "3.7", features = ["client", "transport-io", "transport-streamable-http-client-reqwest"] }

[features]
fault-injection = []

[profile.release]
lto = "thin"
codegen-units = 1

[[bench]]
name = "search"
path = "tests/perf/search.rs"
harness = false
